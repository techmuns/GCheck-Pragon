# Render blueprint — one-click deploy of the Paragon research agent.
# On Render: New + → Blueprint → point at this repo → it reads this file.
# Builds the included Dockerfile (Playwright + Chromium already inside).
services:
  - type: web
    name: paragon
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # free tier — fine for Google + Indian Kanoon + OpenAI
                         # (PrivateCircle/CIBIL Playwright need a paid instance later)
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard to enable the AI-written brief.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Web search, the news deep dive, AND the article reader all ride this one
      # token. It is a Munshot *user session JWT* and it expires — keep
      # SERPAPI_KEY (or GOOGLE_API_KEY + GOOGLE_CX) set alongside it so search
      # falls back instead of going dark, and FIRECRAWL_API_KEY so article
      # reading survives too. Without a reader the brief is written from
      # headlines, which cannot tell you who brought a complaint.
      - key: MUNSHOT_TOKEN
        sync: false
      # Fallback article reader. Set it in the dashboard if you have a key.
      - key: FIRECRAWL_API_KEY
        sync: false
      # Cost dials for a deep run. Each article opened costs one reader call and
      # one OpenAI call, so MAX_ARTICLE_READS is the main one to turn down.
      - key: MAX_ARTICLE_READS
        value: "8"
      - key: MAX_NEWS_QUERIES
        value: "24"
      # How long one source may take before the run goes ahead without it. The
      # news sweep and the article reads are deliberately long.
      - key: SOURCE_DEADLINE_SECONDS
        value: "240"
      # How long an identical search is reused before it costs quota again.
      # 15 minutes by default — raise it to stretch a metered plan further.
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "900"
      # Optional richer / more reliable sources — set in the dashboard if you have them.
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CX
        sync: false
      - key: INDIANKANOON_API_TOKEN
        sync: false
      - key: PRIVATECIRCLE_EMAIL
        sync: false
      - key: PRIVATECIRCLE_PASSWORD
        sync: false
      - key: CIBIL_USERNAME
        sync: false
      - key: CIBIL_PASSWORD
        sync: false
