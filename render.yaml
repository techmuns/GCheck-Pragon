# Render blueprint — one-click deploy of the Paragon research agent.
# On Render: New + → Blueprint → point at this repo → it reads this file.
# Builds the included Dockerfile (Playwright + Chromium already inside).
services:
  - type: web
    name: paragon
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # free tier — fine for Google + Indian Kanoon + OpenAI
                         # (PrivateCircle/CIBIL Playwright need a paid instance later)
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard to enable the AI-written brief.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Web + news search. MUNSHOT_TOKEN is a Munshot *user session JWT* and
      # expires — keep SERPAPI_KEY (or GOOGLE_API_KEY + GOOGLE_CX) set alongside
      # it so search falls back instead of going dark when it does.
      - key: MUNSHOT_TOKEN
        sync: false
      # Optional richer / more reliable sources — set in the dashboard if you have them.
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CX
        sync: false
      - key: INDIANKANOON_API_TOKEN
        sync: false
      - key: PRIVATECIRCLE_EMAIL
        sync: false
      - key: PRIVATECIRCLE_PASSWORD
        sync: false
      - key: CIBIL_USERNAME
        sync: false
      - key: CIBIL_PASSWORD
        sync: false
