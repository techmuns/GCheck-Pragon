# Render blueprint — one-click deploy of the Paragon research agent.
# On Render: New + → Blueprint → point at this repo → it reads this file.
# Builds the included Dockerfile (Playwright + Chromium already inside).
services:
  - type: web
    name: paragon
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # free tier — fine for Google + Indian Kanoon + OpenAI
                         # (PrivateCircle/CIBIL Playwright need a paid instance later)
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Set this in the Render dashboard to enable the AI-written brief.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Narrative-synthesis provider toggle: "openai" (default, above) or
      # "claude" (Bedrock, below). Leave unset/"openai" to change nothing.
      - key: LLM_PROVIDER
        value: openai
      # Only used when LLM_PROVIDER=claude. TEMP_CLAUDE_TOKEN is an AWS
      # Bedrock bearer API key (not an api.anthropic.com key). Region/model
      # default to us-east-1 / us.anthropic.claude-sonnet-4-5-20250929-v1:0 —
      # verify these against the actual AWS account before flipping the toggle.
      - key: TEMP_CLAUDE_TOKEN
        sync: false
      - key: CLAUDE_BEDROCK_REGION
        value: us-east-1
      - key: CLAUDE_BEDROCK_MODEL_ID
        value: us.anthropic.claude-sonnet-4-5-20250929-v1:0
      # Optional richer / more reliable sources — set in the dashboard if you have them.
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CX
        sync: false
      - key: INDIANKANOON_API_TOKEN
        sync: false
      - key: PRIVATECIRCLE_EMAIL
        sync: false
      - key: PRIVATECIRCLE_PASSWORD
        sync: false
      - key: CIBIL_USERNAME
        sync: false
      - key: CIBIL_PASSWORD
        sync: false
