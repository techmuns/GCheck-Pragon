name: Checks

# Types, lint, and a live check of the registry parser.
#
# The registry check hits indiafilings.com for real. That is the point: the
# collector reads third-party HTML, and a fixture could only ever prove we still
# parse the markup as it was on the day the fixture was taken. It needs no
# credential, so it is the one part of this pipeline that can be verified in CI
# at all — everything else is gated behind a Munshot session token.
#
# Scheduled weekly as well as on push, because the failure mode being guarded
# against is the site changing while nobody is touching this repository.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The Bedrock transport against a local stub server — streaming, model
      # fallback, structured-output fallback. No credential, no network, no
      # cost, so it runs on every push like the type and lint checks.
      - run: npm run test:llm
      # Search-backend resilience: failure classification, the circuit breaker,
      # and an end-to-end replay of the outage where every credential was down
      # at once. Stubs `fetch`, so like the transport tests it needs no
      # credential and touches no network — which matters here, because the
      # behaviour it guards only ever shows up when the credentials are broken
      # and there is no way to reproduce that in a live run.
      - run: npm run check:search
      # A saved brief, diffed against the run it was saved from. Re-opening a
      # past run renders a trimmed copy, and every read site in the brief
      # tolerates a missing field — so a trim that goes too far shows up as a
      # quieter document rather than as a failure. This is what notices.
      # Fixtures only: no credential, no network.
      - run: npm run check:archive

  registry-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install step — the check is dependency-free on purpose, so a broken
      # lockfile can never be the reason nobody noticed the parser had rotted.
      - run: node scripts/check-indiafilings.mjs
