name: Site Probe

# Reachability test for a login/data site from a GitHub runner (data-center IP):
# is it Cloudflare/bot-blocked, or does it load? Guides whether a normal server
# can automate it, or whether a residential proxy is required.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to probe"
        required: true
        default: "https://www.privatecircle.co/login"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Plain curl
        run: |
          echo "=== curl (no browser): ${{ inputs.url }} ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "${{ inputs.url }}" || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Real browser probe (Playwright)
        env:
          PROBE_URL: ${{ inputs.url }}
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.47.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = process.env.PROBE_URL;
          const b = await chromium.launch({ args: ['--no-sandbox'] });
          const ctx = await b.newContext({
            userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36',
          });
          const p = await ctx.newPage();
          try {
            const resp = await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 40000 });
            console.log('PROBE URL   :', url);
            console.log('BROWSER STATUS:', resp && resp.status());
            console.log('FINAL URL   :', p.url());
            console.log('PAGE TITLE  :', await p.title());
            const html = await p.content();
            const text = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 400);
            console.log('TEXT SNIPPET:', text);
            const blocked = /captcha|access denied|forbidden|attention required|you have been blocked/i.test(html);
            const hasLogin = /password|sign in|log in|login|email/i.test(html);
            console.log('LOOKS BLOCKED :', blocked);
            console.log('LOGIN VISIBLE :', hasLogin);
          } catch (e) {
            console.log('BROWSER ERROR:', e.message);
          }
          await b.close();
          EOF
          node probe.mjs
